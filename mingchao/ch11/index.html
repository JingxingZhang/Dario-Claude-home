<script type="application/json" id="script-lines">{"lines": [{"id": 1, "text": "1363年四月，洪都城外，号称六十万人。"}, {"id": 2, "text": "船楼，和城墙一样高。"}, {"id": 3, "text": "城墙塌了三十多丈，城里的人一边打，一边砌。"}, {"id": 4, "text": "他们守了八十五天。"}, {"id": 5, "text": "后来，有个人被押到城下，让他劝城里投降。"}, {"id": 6, "text": "他张开嘴，喊了一句。"}, {"id": 7, "text": "守洪都的，是朱元璋的侄子，朱文正。"}, {"id": 8, "text": "早年朱元璋问他，想做什么官。"}, {"id": 9, "text": "他答：“叔父成大业，何患不富贵。”"}, {"id": 10, "text": "朱元璋听了，很高兴。"}, {"id": 11, "text": "有书说，他守城前整天喝酒。"}, {"id": 12, "text": "我翻《明史》，写的是：增城，浚池，号令明肃。"}, {"id": 13, "text": "墙加高了，护城河挖深了。"}, {"id": 14, "text": "邓愈守抚州门，那是最要紧的一处。"}, {"id": 15, "text": "陈友谅亲自来督战。"}, {"id": 16, "text": "城墙塌了三十多丈。"}, {"id": 17, "text": "邓愈一边砌，一边打。"}, {"id": 18, "text": "三个月，他夜里没有脱过甲。"}, {"id": 19, "text": "薛显守章江、新城两门。"}, {"id": 20, "text": "他不只守，时常开门，带精兵冲出去。"}, {"id": 21, "text": "陈友谅手下的大将刘进昭，就死在这样一次出城里。"}, {"id": 22, "text": "傍晚，赵德胜坐在城门楼上指挥。"}, {"id": 23, "text": "一支弩箭射进他的腰，箭头进去六寸。"}, {"id": 24, "text": "他自己拔了出来。"}, {"id": 25, "text": "他说，从军以来中箭多了，没有这么重的。"}, {"id": 26, "text": "死不恨，只恨不能扫清中原。"}, {"id": 27, "text": "说完，就断了气。他三十九岁。"}, {"id": 28, "text": "城里城外，断了消息。"}, {"id": 29, "text": "朱文正派一个叫张子明的武官，出去报信。"}, {"id": 30, "text": "他从水关溜了出去。"}, {"id": 31, "text": "夜里走，白天停，半个月，才到应天。"}, {"id": 32, "text": "城外号称六十万。他坐的，是一条打鱼的小船。"}, {"id": 33, "text": "朱元璋问敌情。"}, {"id": 34, "text": "张子明说：他们人多，死的也不少。江水一天天退，大船就不好使了。"}, {"id": 35, "text": "朱元璋说：回去告诉你的主帅，再守一个月，我自己去取。"}, {"id": 36, "text": "张子明往回走，到湖口，被陈友谅的人抓住了。"}, {"id": 37, "text": "陈友谅要他去城下，劝城里投降。"}, {"id": 38, "text": "他答应了。"}, {"id": 39, "text": "劝降，能活。喊坚守，会死。"}, {"id": 40, "text": "换了是你，站在城下，喊哪一句？"}, {"id": 41, "text": "他到了城下，大声喊："}, {"id": 42, "text": "我是张大舍，已经见过主上了！"}, {"id": 43, "text": "诸位坚守，救兵就到！"}, {"id": 44, "text": "陈友谅的人，用长槊把他刺死了。"}, {"id": 45, "text": "七月，朱元璋亲自带兵来救。"}, {"id": 46, "text": "陈友谅听说，撤了围，掉头去了鄱阳湖。"}, {"id": 47, "text": "这八十五天，先后战死、写进《明史》的，有十四个人。"}, {"id": 48, "text": "两年后，同一个叔父来到南昌，把朱文正带走，安置在桐城。"}, {"id": 49, "text": "四月围城，城墙塌了又补，小船出城，七月解围。"}, {"id": 50, "text": "八十五天，就这四步。下一集，从最后一步往下讲。"}, {"id": 51, "text": "七月，两支船队，在鄱阳湖上对上了。"}, {"id": 52, "text": "这一仗打完，陈友谅本人怎么样了，懂的人大约已经知道了。"}, {"id": 53, "text": "评论里先写出来罢。"}, {"id": 54, "text": "洪都的城墙，塌了又补。"}, {"id": 55, "text": "补过的地方，有几十丈。"}], "chunks": [{"line": 1, "a": 0, "b": 11, "text": "1363年四月，洪都城外"}, {"line": 1, "a": 11, "b": 17, "text": "号称六十万人"}, {"line": 2, "a": 0, "b": 8, "text": "船楼，和城墙一样高"}, {"line": 3, "a": 0, "b": 8, "text": "城墙塌了三十多丈"}, {"line": 3, "a": 8, "b": 18, "text": "城里的人一边打，一边砌"}, {"line": 4, "a": 0, "b": 8, "text": "他们守了八十五天"}, {"line": 5, "a": 0, "b": 10, "text": "后来，有个人被押到城下"}, {"line": 5, "a": 10, "b": 17, "text": "让他劝城里投降"}, {"line": 6, "a": 0, "b": 8, "text": "他张开嘴，喊了一句"}, {"line": 7, "a": 0, "b": 11, "text": "守洪都的，是朱元璋的侄子"}, {"line": 7, "a": 11, "b": 14, "text": "朱文正"}, {"line": 8, "a": 0, "b": 12, "text": "早年朱元璋问他，想做什么官"}, {"line": 9, "a": 0, "b": 7, "text": "他答：叔父成大业"}, {"line": 9, "a": 7, "b": 12, "text": "何患不富贵。"}, {"line": 10, "a": 0, "b": 8, "text": "朱元璋听了，很高兴"}, {"line": 11, "a": 0, "b": 11, "text": "有书说，他守城前整天喝酒"}, {"line": 12, "a": 0, "b": 9, "text": "我翻《明史》，写的是：增城"}, {"line": 12, "a": 9, "b": 15, "text": "浚池，号令明肃"}, {"line": 13, "a": 0, "b": 10, "text": "墙加高了，护城河挖深了"}, {"line": 14, "a": 0, "b": 6, "text": "邓愈守抚州门"}, {"line": 14, "a": 6, "b": 14, "text": "那是最要紧的一处"}, {"line": 15, "a": 0, "b": 8, "text": "陈友谅亲自来督战"}, {"line": 16, "a": 0, "b": 8, "text": "城墙塌了三十多丈"}, {"line": 17, "a": 0, "b": 8, "text": "邓愈一边砌，一边打"}, {"line": 18, "a": 0, "b": 11, "text": "三个月，他夜里没有脱过甲"}, {"line": 19, "a": 0, "b": 9, "text": "薛显守章江、新城两门"}, {"line": 20, "a": 0, "b": 8, "text": "他不只守，时常开门"}, {"line": 20, "a": 8, "b": 14, "text": "带精兵冲出去"}, {"line": 21, "a": 0, "b": 11, "text": "陈友谅手下的大将刘进昭"}, {"line": 21, "a": 11, "b": 21, "text": "就死在这样一次出城里"}, {"line": 22, "a": 0, "b": 2, "text": "傍晚"}, {"line": 22, "a": 2, "b": 13, "text": "赵德胜坐在城门楼上指挥"}, {"line": 23, "a": 0, "b": 9, "text": "一支弩箭射进他的腰"}, {"line": 23, "a": 9, "b": 15, "text": "箭头进去六寸"}, {"line": 24, "a": 0, "b": 7,

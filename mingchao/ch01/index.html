<script type="application/json" id="script-lines">{"lines": [{"id": 1, "text": "1328年，濠州钟离，一户佃农家里，生了个男孩。"}, {"id": 2, "text": "他没有像样的名字，只有一个数：重八。"}, {"id": 3, "text": "四十年后，他坐上了龙椅。"}, {"id": 4, "text": "那个数是怎么来的，到今天也没人说得准。"}, {"id": 5, "text": "史书写皇帝出生，照例要有些异样。"}, {"id": 6, "text": "《明史》写的是：红光满室。"}, {"id": 7, "text": "邻居望见，以为朱家失了火，跑来救。"}, {"id": 8, "text": "到了门口，火是没有的。"}, {"id": 9, "text": "屋里只多了一个孩子。"}, {"id": 10, "text": "和一张吃饭的嘴。"}, {"id": 11, "text": "他是家里第四个儿子。爹叫朱五四，没有地，租别人的地来耕种。"}, {"id": 12, "text": "朱家几代人的名字，摆在一起是这样的："}, {"id": 13, "text": "高祖朱百六，曾祖朱四九。"}, {"id": 14, "text": "祖父朱初一，父亲朱五四。"}, {"id": 15, "text": "名字是个数，人也就是个数。"}, {"id": 16, "text": "有人说，元朝不许百姓取名，只能拿爹娘的岁数相加。"}, {"id": 17, "text": "史料里，查不到这条规定。"}, {"id": 18, "text": "常遇春家、汤和家，祖上也都是数。"}, {"id": 19, "text": "爹娘的岁数，出生的日子，还是族里的排行——"}, {"id": 20, "text": "你觉得，“重八”是哪一种？"}, {"id": 21, "text": "稍大一点，他去给地主刘德家放牛。"}, {"id": 22, "text": "他想读书。朱家拿不出学费。"}, {"id": 23, "text": "他的打算，大约是这样的："}, {"id": 24, "text": "娶个能干活的媳妇，生几个孩子，"}, {"id": 25, "text": "孩子长大，再给刘家放牛。"}, {"id": 26, "text": "刘德这个名字，十几年后，他还要再去求一回。"}, {"id": 27, "text": "那时管着天下的，是元朝。"}, {"id": 28, "text": "从他出生那年起，五年里，换了五个新皇帝。"}, {"id": 29, "text": "一个九岁登基，一个多月就被赶下了台；"}, {"id": 30, "text": "一个和弟弟见面才几天，便死了。"}, {"id": 31, "text": "上面忙着换人，下面的官吏忙着收钱。"}, {"id": 32, "text": "元末有个读书人叫叶子奇，把名目一个个记了下来："}, {"id": 33, "text": "新官上任，收拜见钱。"}, {"id": 34, "text": "逢年过节，收追节钱。"}, {"id": 35, "text": "过生日，收生日钱。"}, {"id": 36, "text": "打官司，收公事钱。"}, {"id": 37, "text": "什么事都没有，也收，叫撒花钱。"}, {"id": 38, "text": "官吏们，倒是很勤快。"}, {"id": 39, "text": "1337年，权臣伯颜上奏：把姓张、王、刘、李、赵的汉人，杀掉。"}, {"id": 40, "text": "皇帝没有答应。"}, {"id": 41, "text": "朱家，不在这五个姓里。"}, {"id": 42, "text": "至正四年，1344年。"}, {"id": 43, "text": "淮河两岸，先是大旱。"}, {"id": 44, "text": "然后是蝗虫。"}, {"id": 45, "text": "然后是饥荒，瘟疫。"}, {"id": 46, "text": "五月，黄河在白茅堤决了口。"}, {"id": 47, "text": "这一年，朱重八十七岁。"}, {"id": 48, "text": "七年后，据载，有人在黄河的河道里，挖出一个独眼石人。"}, {"id": 49, "text": "背上刻着：石人一只眼，挑动黄河天下反。"}, {"id": 50, "text": "1328，1337，1344，1351。"}, {"id": 51, "text": "四个年份。后面几集，都从这张表上往下走。"}, {"id": 52, "text": "下一集，1344年的春天。"}, {"id": 53, "text": "他去求地主刘德，要一块埋人的地。"}, {"id": 54, "text": "刘德没有给。后来给地的那个人是谁，懂的人大约已经知道了。"}, {"id": 55, "text": "评论里先写出来罢。"}, {"id": 56, "text": "那时候，他还叫重八。"}, {"id": 57, "text": "一个数。"}], "chunks": [{"line": 1, "a": 0, "b": 9, "text": "1328年，濠州钟离"}, {"line": 1, "a": 9, "b": 20, "text": "一户佃农家里，生了个男孩"}, {"line": 2, "a": 0, "b": 8, "text": "他没有像样的名字"}, {"line": 2, "a": 8, "b": 15, "text": "只有一个数：重八"}, {"line": 3, "a": 0, "b": 10, "text": "四十年后，他坐上了龙椅"}, {"line": 4, "a": 0, "b": 8, "text": "那个数是怎么来的"}, {"line": 4, "a": 8, "b": 17, "text": "到今天也没人说得准"}, {"line": 5, "a": 0, "b": 7, "text": "史书写皇帝出生"}, {"line": 5, "a": 7, "b": 14, "text": "照例要有些异样"}, {"line": 6, "a": 0, "b": 9, "text": "《明史》写的是：红光满室"}, {"line": 7, "a": 0, "b": 11, "text": "邻居望见，以为朱家失了火"}, {"line": 7, "a": 11, "b": 14, "text": "跑来救"}, {"line": 8, "a": 0, "b": 9, "text": "到了门口，火是没有的"}, {"line": 9, "a": 0, "b": 9, "text": "屋里只多了一个孩子"}, {"line": 10, "a": 0, "b": 7, "text": "和一张吃饭的嘴"}, {"line": 11, "a": 0, "b": 9, "text": "他是家里第四个儿子"}, {"line": 11, "a": 9, "b": 17, "text": "爹叫朱五四，没有地"}, {"line": 11, "a": 17, "b": 25, "text": "租别人的地来耕种"}, {"line": 12, "a": 0, "b": 8, "text": "朱家几代人的名字"}, {"line": 12, "a": 8, "b": 16, "text": "摆在一起是这样的"}, {"line": 13, "a": 0, "b": 10, "text": "高祖朱百六，曾祖朱四九"}, {"line": 14, "a": 0, "b": 10, "text": "祖父朱初一，父亲朱五四"}, {"line": 15, "a": 0, "b": 11, "text": "名字是个数，人也就是个数"}, {"line": 16, "a": 0, "b": 11, "text": "有人说，元朝不许百姓取名"}, {"line": 16, "a": 11, "b": 21, "text": "只能拿爹娘的岁数相加"}, {"line": 17, "a": 0, "b": 10, "text": "史料里，查不到这条规定"}, {"line": 18, "a": 0, "b": 7, "text": "常遇春家、汤和家"}, {"line": 18, "a": 7, "b": 13, "text": "祖上也都是数"}, {"line": 19, "a": 0, "b": 10, "text": "爹娘的岁数，出生的日子"}, {"line": 19, "a": 10, "b": 17, "text": "还是族里的排行"}, {"line": 20, "a": 0, "b": 9, "text": "你觉得，“重八”是哪一种？"}, {"line": 21, "a": 0, "b": 4, "text": "稍大一点"}, {"line": 21, "a": 4, "b": 14, "text": "他去给地主刘德家放牛"}, {"line": 22, "a": 0, "

<script type="application/json" id="script-lines">{"lines": [{"id": 1, "text": "1363年七月，鄱阳湖。"}, {"id": 2, "text": "陈友谅把大船连成一片，船楼高十几丈，望过去像山。"}, {"id": 3, "text": "朱元璋的船小，士兵只能仰着头打。"}, {"id": 4, "text": "一个多月后，陈友谅死在一支流箭下。"}, {"id": 5, "text": "中间隔着的，是一个下午的东北风，和一湖红了的水。"}, {"id": 6, "text": "开战那天，朱元璋把船分成十一队。"}, {"id": 7, "text": "徐达打前锋。俞通海用火炮，烧了陈友谅几十条船。"}, {"id": 8, "text": "两边死伤，差不多。"}, {"id": 9, "text": "这时，陈友谅的大将张定边，带着船，直冲朱元璋的座船。"}, {"id": 10, "text": "朱元璋的船想退，船底卡在沙上，退不动。"}, {"id": 11, "text": "张定边的船，越来越近。"}, {"id": 12, "text": "常遇春在旁边的船上，拉弓，一箭射中张定边。"}, {"id": 13, "text": "俞通海的船也赶到，船一挤，水涌起来，"}, {"id": 14, "text": "朱元璋的船，才脱了身。"}, {"id": 15, "text": "常遇春自己的船，接着也卡在了浅处。"}, {"id": 16, "text": "一条打烂了的船顺水漂下来，把它撞了出去。"}, {"id": 17, "text": "第二天，陈友谅的巨舰全部出来。"}, {"id": 18, "text": "朱元璋的将领们，脸上有了怕色。"}, {"id": 19, "text": "朱元璋亲自挥旗，船还是不往前。"}, {"id": 20, "text": "他杀了往后退的十几个人。"}, {"id": 21, "text": "丁普郎原来是陈友谅的部将，后来投了朱元璋。"}, {"id": 22, "text": "丁普郎从上午打到中午，身上受了十几处伤。"}, {"id": 23, "text": "头掉了，身子还站着，手里拿着兵器。"}, {"id": 24, "text": "对面的人，以为见了神。"}, {"id": 25, "text": "到了下午，东北风起来了。"}, {"id": 26, "text": "朱元璋让敢死的人，驾着七条船，"}, {"id": 27, "text": "船里塞满火药和芦苇，"}, {"id": 28, "text": "顺着风，撞向陈友谅的船。"}, {"id": 29, "text": "风大，火旺，烟遮了天。"}, {"id": 30, "text": "湖水，全红了。"}, {"id": 31, "text": "那一天，陈友谅的人被砍了两千多个头，烧死、淹死的，数不清。"}, {"id": 32, "text": "隔了两天再打，陈友谅又败了。"}, {"id": 33, "text": "陈友谅把船收拢，不敢再出来打。"}, {"id": 34, "text": "他手下左右两个金吾将军，投了朱元璋。"}, {"id": 35, "text": "陈友谅大怒，把抓到的朱军将士，全杀了。"}, {"id": 36, "text": "朱元璋把抓到的人，全放了回去。受了伤的，给敷上好药。"}, {"id": 37, "text": "船太大，风不对，还是人心散了——"}, {"id": 38, "text": "你觉得，陈友谅输在哪一样？"}, {"id": 39, "text": "两边在湖上，又耗了将近一个月。"}, {"id": 40, "text": "八月，陈友谅的粮吃完了。"}, {"id": 41, "text": "他带着一百条船，往湖口冲。"}, {"id": 42, "text": "朱元璋的船守在上游，顺着水迎上去。"}, {"id": 43, "text": "一支流箭，射中了陈友谅。他死了。"}, {"id": 44, "text": "张定边带着陈友谅的儿子陈理，逃回了武昌。"}, {"id": 45, "text": "第二年二月，陈理出城投降。"}, {"id": 46, "text": "开战，火攻，两道命令，湖口。"}, {"id": 47, "text": "这一仗，就这四段。下一集，换一个对手。"}, {"id": 48, "text": "下一集，东边，一个卖盐出身的人，张士诚。"}, {"id": 49, "text": "他最后是怎么死的，懂的人大约已经知道了。"}, {"id": 50, "text": "评论里先写出来罢。"}, {"id": 51, "text": "鄱阳湖的水，那天是红的。"}, {"id": 52, "text": "后来，又清了。"}], "chunks": [{"line": 1, "a": 0, "b": 10, "text": "1363年七月，鄱阳湖"}, {"line": 2, "a": 0, "b": 10, "text": "陈友谅把大船连成一片"}, {"line": 2, "a": 10, "b": 21, "text": "船楼高十几丈，望过去像山"}, {"line": 3, "a": 0, "b": 6, "text": "朱元璋的船小"}, {"line": 3, "a": 6, "b": 14, "text": "士兵只能仰着头打"}, {"line": 4, "a": 0, "b": 5, "text": "一个多月后"}, {"line": 4, "a": 5, "b": 15, "text": "陈友谅死在一支流箭下"}, {"line": 5, "a": 0, "b": 5, "text": "中间隔着的"}, {"line": 5, "a": 5, "b": 14, "text": "是一个下午的东北风"}, {"line": 5, "a": 14, "b": 21, "text": "和一湖红了的水"}, {"line": 6, "a": 0, "b": 4, "text": "开战那天"}, {"line": 6, "a": 4, "b": 14, "text": "朱元璋把船分成十一队"}, {"line": 7, "a": 0, "b": 11, "text": "徐达打前锋。俞通海用火炮"}, {"line": 7, "a": 11, "b": 20, "text": "烧了陈友谅几十条船"}, {"line": 8, "a": 0, "b": 7, "text": "两边死伤，差不多"}, {"line": 9, "a": 0, "b": 11, "text": "这时，陈友谅的大将张定边"}, {"line": 9, "a": 11, "b": 22, "text": "带着船，直冲朱元璋的座船"}, {"line": 10, "a": 0, "b": 7, "text": "朱元璋的船想退"}, {"line": 10, "a": 7, "b": 16, "text": "船底卡在沙上，退不动"}, {"line": 11, "a": 0, "b": 9, "text": "张定边的船，越来越近"}, {"line": 12, "a": 0, "b": 11, "text": "常遇春在旁边的船上，拉弓"}, {"line": 12, "a": 11, "b": 18, "text": "一箭射中张定边"}, {"line": 13, "a": 0, "b": 11, "text": "俞通海的船也赶到，船一挤"}, {"line": 13, "a": 11, "b": 15, "text": "水涌起来"}, {"line": 14, "a": 0, "b": 9, "text": "朱元璋的船，才脱了身"}, {"line": 15, "a": 0, "b": 7, "text": "常遇春自己的船"}, {"line": 15, "a": 7, "b": 15, "text": "接着也卡在了浅处"}, {"line": 16, "a": 0, "b": 12, "text": "一条打烂了的船顺水漂下来"}, {"line": 16, "a": 12, "b": 18, "text": "把它撞了出去"}, {"line": 17, "a": 0, "b": 3, "text": "第二天"}, {"line": 17, "a": 3, "b": 13, "text": "陈友谅的巨舰全部出来"}, {"line": 18, "a": 0, "b": 7, "text": "朱元璋的将领们"}, {"line": 18, "a": 7, "b": 13, "text": "脸上有了怕色"}, {"line": 19, "a": 0, "b": 7, "text": "朱元璋亲自挥旗"}, {"line": 19, "a": 7, "b": 13, "text": "船还是不往前"}, {"line": 20, "a": 0, "b": 11, "text": "他杀了往后退的十几个人"}, {"line": 21, "a": 0, "b 3, "b": 18, "text": "逃回了武昌"}, {"line": 45, "a": 0, "b": 11, "text": "第二年二月，陈理出城投降"}, {"line": 46, "a": 0, "b": 10, "text": "开战，火攻，两道命令，湖口"}, {"line": 47, "a": 0, "b": 10, "text": "这一仗，就这四段。下一集"}, {"line": 47, "a": 10, "b": 15, "text": "换一个对手"}, {"line": 48, "a": 0, "b": 5, "text": "下一集，东边"}, {"line": 48, "a": 5, "b": 16, "text": "一个卖盐出身的人，张士诚"}, {"line": 49, "a": 0, "b": 8, "text": "他最后是怎么死的"}, {"line": 49, "a": 8, "b": 18, "text": "懂的人大约已经知道了"}, {"line": 50, "a": 0, "b": 8, "text": "评论里先写出来罢"}, {"line": 51, "a": 0, "b": 10, "text": "鄱阳湖的水，那天是红的"}, {"line": 52, "a": 0, "b": 5, "text": "后来，又清了"}]}</script>
